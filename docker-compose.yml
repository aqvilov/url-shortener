version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urlshortener}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener-server
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      CONFIG_PATH: /local/local.yaml
      DB_CONN: "host=postgres port=5432 user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-urlshortener} sslmode=disable"
      MIDDLEWARE_TOKEN: ${MIDDLEWARE_TOKEN:?MIDDLEWARE_TOKEN is not set in .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: